{{- /* Secrets live in OCI Vault; External Secrets Operator syncs them using the node's instance principal
       (no static cloud credentials in the cluster). Mirrors dt-telekom's selfcare chart. The OKE node
       dynamic group already has compartment-wide secret-family read, so aidlc-vault is covered. */}}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: oci-vault
  labels: {{- include "aidlc.labels" . | nindent 4 }}
spec:
  provider:
    oracle:
      vault: {{ required "oci.vaultId is required" .Values.oci.vaultId | quote }}
      region: {{ .Values.oci.region | quote }}
      principalType: InstancePrincipal
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aidlc-secrets
  labels: {{- include "aidlc.labels" . | nindent 4 }}
spec:
  refreshInterval: 5m
  secretStoreRef: { name: oci-vault, kind: SecretStore }
  target: { name: aidlc-secrets, deletionPolicy: Retain }
  data:
  {{- range .Values.secrets }}
    - secretKey: {{ . }}
      remoteRef: { key: {{ printf "%s%s" $.Values.secretPrefix . }} }
  {{- end }}
