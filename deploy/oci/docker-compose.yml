# secrets-init (one-shot) fills a RAM-only tmpfs volume from OCI Vault; the app sources it then runs.
services:
  secrets-init:
    build: { context: ../.., dockerfile: deploy/oci/Dockerfile.secrets }
    env_file: .env
    environment: [ "SECRETS_DIR=/secrets" ]
    volumes: [ "secrets:/secrets" ]
    restart: "no"
  app:
    build: { context: ../.., dockerfile: deploy/oci/Dockerfile }
    env_file: .env
    environment: [ "SECRETS_DIR=/secrets" ]
    volumes: [ "secrets:/secrets:ro" ]
    ports: [ "80:8787" ]
    depends_on:
      secrets-init: { condition: service_completed_successfully }
    restart: unless-stopped
volumes:
  secrets:
    driver_opts: { type: tmpfs, device: tmpfs }   # RAM-only — secrets never hit disk
