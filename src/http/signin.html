<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sign in · AIDLC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ===================== design tokens ===================== */
:root{
  --bg:#f5f6f9; --surface:#ffffff; --surface-2:#eef1f5; --surface-3:#e7ebf1;
  --border:#e1e5ec; --border-strong:#cfd5e0;
  --fg:#171a21; --muted:#5f6672; --faint:#878e9b;
  --accent:#3b5bdb; --accent-weak:rgba(59,91,219,.12); --accent-ink:#2742b8;
  --good:#2f9e44; --good-weak:rgba(47,158,68,.14);
  --warn:#d9820b; --warn-weak:rgba(217,130,11,.15);
  --crit:#e03131; --crit-weak:rgba(224,49,49,.12);
  --violet:#7048e8; --violet-weak:rgba(112,72,232,.12);
  --font-d:"Space Grotesk",system-ui,sans-serif;
  --font-b:"Inter",system-ui,sans-serif;
  --font-m:"JetBrains Mono",ui-monospace,monospace;
  --radius:12px; --radius-s:8px;
  --shadow:0 1px 2px rgba(20,24,33,.05),0 6px 20px rgba(20,24,33,.06);
  --shadow-lg:0 2px 6px rgba(20,24,33,.06),0 18px 50px rgba(20,24,33,.12);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1015; --surface:#161922; --surface-2:#1d212b; --surface-3:#242a36;
  --border:#2a303c; --border-strong:#3a4250;
  --fg:#e7eaef; --muted:#9aa1ad; --faint:#747c89;
  --accent:#6f8bff; --accent-weak:rgba(111,139,255,.16); --accent-ink:#a9bbff;
  --good:#51cf66; --good-weak:rgba(81,207,102,.16);
  --warn:#ffb057; --warn-weak:rgba(255,176,87,.16);
  --crit:#ff6b6b; --crit-weak:rgba(255,107,107,.16);
  --violet:#b197fc; --violet-weak:rgba(177,151,252,.16);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 24px 60px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1015; --surface:#161922; --surface-2:#1d212b; --surface-3:#242a36;
  --border:#2a303c; --border-strong:#3a4250;
  --fg:#e7eaef; --muted:#9aa1ad; --faint:#747c89;
  --accent:#6f8bff; --accent-weak:rgba(111,139,255,.16); --accent-ink:#a9bbff;
  --good:#51cf66; --good-weak:rgba(81,207,102,.16);
  --warn:#ffb057; --warn-weak:rgba(255,176,87,.16);
  --crit:#ff6b6b; --crit-weak:rgba(255,107,107,.16);
  --violet:#b197fc; --violet-weak:rgba(177,151,252,.16);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 24px 60px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-d);margin:0;font-weight:600;text-wrap:balance}
a{color:inherit;text-decoration:none}
.mono{font-family:var(--font-m);font-variant-numeric:tabular-nums}
.screen[hidden]{display:none!important}
.fade{opacity:0;transform:translateY(6px);animation:fin .4s ease forwards}
@keyframes fin{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none;opacity:1;transform:none}}

/* ===================== shared atoms ===================== */
.btn{all:unset;cursor:pointer;font-size:13px;font-weight:600;padding:8px 14px;border-radius:9px;border:1px solid var(--border-strong);color:var(--fg);background:var(--surface);white-space:nowrap;text-align:center}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.06)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.lg{padding:12px 22px;font-size:15px}
.btn.block{display:block;width:100%}
.iconbtn{all:unset;cursor:pointer;width:34px;height:34px;border-radius:9px;border:1px solid var(--border);display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{color:var(--fg);border-color:var(--border-strong)}
/* theme menu (labeled popover: System / Light / Dark / Auto) */
.thememenu{position:relative}
.thememenu .tmpop{position:absolute;top:calc(100% + 8px);right:0;width:238px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;z-index:70;display:none}
.thememenu.open .tmpop{display:block}
.thememenu.open .iconbtn{color:var(--fg);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.tmopt{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;box-sizing:border-box;width:100%}
.tmopt:hover{background:var(--surface-2)}
.tmopt .tmic{width:20px;flex:none;text-align:center;font-size:14px;color:var(--fg)}
.tmopt .tmtx{flex:1;min-width:0}
.tmopt .tmname{font-size:13px;font-weight:600;color:var(--fg);display:flex;align-items:center;gap:7px}
.tmopt .tmbadge{font-size:9px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--accent-ink);background:var(--accent-weak);border-radius:5px;padding:1px 5px}
.tmopt .tmdesc{font-size:11px;color:var(--muted);margin-top:2px}
.tmopt .tmck{flex:none;color:var(--accent-ink);font-weight:700;opacity:0}
.tmopt.sel .tmck{opacity:1}
.tmhint{font-size:10.5px;color:var(--faint);padding:7px 10px 3px;border-top:1px solid var(--border);margin-top:4px}
.iconbtn:hover{color:var(--fg);border-color:var(--border-strong)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--border);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%}
.chip.good{background:var(--good-weak);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-weak);color:var(--warn);border-color:transparent}
.chip.crit{background:var(--crit-weak);color:var(--crit);border-color:transparent}
.chip.acc{background:var(--accent-weak);color:var(--accent-ink);border-color:transparent}
.chip.vio{background:var(--violet-weak);color:var(--violet);border-color:transparent}
.chip.mut{color:var(--muted)}
.tag{font-size:11px;font-weight:600;letter-spacing:.3px;color:var(--faint);text-transform:uppercase}
.lead{color:var(--muted);max-width:64ch}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow);min-width:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.section-h{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.section-h h2{font-size:16px}
.hr{height:1px;background:var(--border);margin:22px 0}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:7px 0;border-bottom:1px dashed var(--border)}
.kv:last-child{border-bottom:0}.kv .k{color:var(--muted)}
.stat .n{font-family:var(--font-d);font-size:26px;font-weight:600;letter-spacing:-.5px}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px}
.stat .d{font-size:11.5px;font-weight:600;margin-top:6px}
.up{color:var(--good)}.down{color:var(--crit)}
.spark{display:flex;align-items:flex-end;gap:3px;height:34px;margin-top:10px}
.spark i{flex:1;background:var(--accent-weak);border-radius:2px 2px 0 0}
.spark i.hi{background:var(--accent)}
.inp{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:9px 12px;color:var(--fg);font:inherit;font-size:13px}
.inp::placeholder{color:var(--faint)}
.selrow{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:12px;padding:6px 11px;border-radius:999px;border:1px solid var(--border);color:var(--muted);cursor:pointer;user-select:none}
.pill.on{background:var(--accent-weak);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.files{display:flex;flex-direction:column;gap:6px;margin:4px 0}
.file{display:flex;align-items:center;gap:8px;font-family:var(--font-m);font-size:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:7px 10px}
.file .add{color:var(--good)}.file .del{color:var(--crit)}
.diff{background:#0d1017;border:1px solid var(--border);border-radius:9px;padding:11px 13px;font-family:var(--font-m);font-size:11.5px;line-height:1.7;overflow-x:auto;color:#c6cdd8}
.diff .p{color:#64d08a}.diff .m{color:#f08a8a}.diff .c{color:#6b7686}
.check{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0}
.check .ok{color:var(--good)}.check .no{color:var(--crit)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.banner{display:flex;align-items:center;gap:10px;background:var(--warn-weak);border:1px solid transparent;border-radius:10px;padding:10px 13px;font-size:13px;font-weight:600;color:var(--warn);margin-bottom:14px}
.hintbar{display:flex;gap:10px;align-items:center;background:var(--accent-weak);color:var(--accent-ink);border-radius:10px;padding:11px 14px;font-size:13px;margin-bottom:18px;font-weight:500}

/* ===================== demo nav (full-bleed screens) ===================== */
.demonav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:60;display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px;box-shadow:var(--shadow-lg)}
.demonav button{all:unset;cursor:pointer;font-size:11.5px;font-weight:600;color:var(--muted);padding:5px 11px;border-radius:999px}
.demonav button:hover{color:var(--fg);background:var(--surface-2)}
.demonav button.on{background:var(--accent);color:#fff}

/* ===================== marketing / homepage ===================== */
.fb{min-height:100vh;min-height:100dvh;background:var(--bg)}
.mkt{max-width:1140px;margin:0 auto;padding:0 max(22px,env(safe-area-inset-left,0px))}
.brandlogo{display:flex;align-items:center;gap:10px;cursor:pointer}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#8ea2ff);display:grid;place-items:center;color:#fff;font-family:var(--font-d);font-weight:700;font-size:15px;flex:none}
.brandlogo b{font-family:var(--font-d);font-size:17px;letter-spacing:.2px}
/* ---- dark hero band ---- */
.heroband{position:relative;overflow-x:clip;background:#0a0b12;color:#fff}
.heroband .brandlogo b{color:#fff}
.heroband::before{content:"";position:absolute;inset:-25% -10% auto -10%;height:760px;z-index:0;pointer-events:none;
  background:radial-gradient(52% 55% at 50% 2%,rgba(111,139,255,.5),transparent 70%),radial-gradient(38% 48% at 83% 16%,rgba(177,151,252,.42),transparent 70%),radial-gradient(40% 50% at 14% 24%,rgba(59,91,219,.34),transparent 70%)}
.heroband::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:46px 46px;
  -webkit-mask-image:radial-gradient(72% 62% at 50% 0%,#000,transparent 76%);mask-image:radial-gradient(72% 62% at 50% 0%,#000,transparent 76%)}
.herowrap{position:relative;z-index:2;max-width:1140px;margin:0 auto;padding:0 max(22px,env(safe-area-inset-left,0px));text-align:center}
.mktnav{display:flex;align-items:center;gap:14px;padding:18px 0}
.mktnav .links{display:flex;gap:24px;margin-left:30px}
.mktnav .links a{font-size:13.5px;color:rgba(255,255,255,.72);font-weight:500;cursor:pointer}
.mktnav .links a:hover{color:#fff}
.mktnav .btn.ghost{color:#fff}
.herotop{padding:54px 0 0}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:#cdd6ff;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);padding:6px 14px;border-radius:999px;margin-bottom:22px;backdrop-filter:blur(6px)}
.display{font-family:var(--font-d);font-size:clamp(33px,5.6vw,62px);line-height:1.01;letter-spacing:-1.6px;font-weight:700;max-width:15ch;margin:0 auto}
.display .g{background:linear-gradient(115deg,#9db0ff,#c3b0fc 55%,#9db0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.herosub{font-size:clamp(15px,1.7vw,18px);color:rgba(255,255,255,.72);margin:22px auto 26px;max-width:56ch;line-height:1.55}
.heroctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.heroctas .btn{border-color:rgba(255,255,255,.22);color:#fff;background:rgba(255,255,255,.06)}
.heroctas .btn:hover{border-color:rgba(255,255,255,.5)}
.heroctas .btn.pri{background:#fff;color:#141821;border-color:#fff}
.heroctas .btn.pri:hover{filter:none;background:#eaeeff}
.herofoot{margin-top:18px;font-size:12.5px;color:rgba(255,255,255,.5)}
/* product mock in a browser frame (straddles into the light body) */
.heroshot{position:relative;z-index:3;max-width:980px;margin:46px auto -72px;padding:0 20px}
.browser{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 44px 100px -24px rgba(5,6,14,.75),0 12px 34px rgba(5,6,14,.5);overflow:hidden}
.bbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface-2)}
.bdots{display:flex;gap:6px}.bdots i{width:11px;height:11px;border-radius:50%;background:var(--border-strong)}
.burl{flex:1;text-align:center;font-family:var(--font-m);font-size:11.5px;color:var(--faint);background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:4px 10px;max-width:380px;margin:0 auto}
.bbody{padding:16px;display:grid;grid-template-columns:150px 1fr 230px;gap:14px;background:var(--bg)}
.mstage{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.mstage.sel{background:var(--accent-weak);color:var(--accent-ink)}
.mst{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;border:1.5px solid var(--border-strong);color:var(--muted);flex:none}
.mst.done{background:var(--good);border-color:var(--good);color:#fff}
.mst.gate{background:var(--warn-weak);border-color:var(--warn);color:var(--warn)}
.mdag{display:flex;flex-direction:column;align-items:center;justify-content:center}
.mnode{width:min(100%,230px);border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;background:var(--surface);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px;color:var(--fg)}
.mnode.done{color:var(--muted)}
.mnode.gate{border-color:var(--warn);box-shadow:0 0 0 3px var(--warn-weak)}
.mconn{width:2px;height:15px;background:var(--border-strong)}
.mgate{border:1.5px solid var(--warn);background:var(--warn-weak);border-radius:11px;padding:12px}
.mgate .mgt{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--warn);margin-bottom:7px}
.mdiff{background:#0d1017;border-radius:7px;padding:8px 10px;font-family:var(--font-m);font-size:10px;line-height:1.65;color:#c6cdd8;margin:8px 0}
.mdiff .p{color:#64d08a}.mdiff .m{color:#f08a8a}.mdiff .c{color:#6b7686}
/* trust strip */
.trust{padding:98px 0 6px;text-align:center}
.trust .tl{font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--faint);font-weight:600}
.trustrow{display:flex;flex-wrap:wrap;gap:14px 30px;justify-content:center;align-items:center;margin-top:16px}
.trustrow span{font-family:var(--font-d);font-weight:600;font-size:15px;color:var(--muted);opacity:.85}
/* stat band */
.statband{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--surface);margin:30px 0 10px;box-shadow:var(--shadow)}
.statband div{padding:22px 18px;border-right:1px solid var(--border)}
.statband div:last-child{border-right:0}
.statband .n{font-family:var(--font-d);font-size:30px;font-weight:700;letter-spacing:-.6px;background:linear-gradient(120deg,var(--accent),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.statband .l{font-size:12.5px;color:var(--muted);margin-top:4px}
/* sections */
.mkt-sec{padding:56px 0}
.mkt-sec.ctr{text-align:center}
.mkt-sec .kick{font-size:12.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--accent-ink)}
.mkt-sec h2{font-size:clamp(23px,3.2vw,34px);letter-spacing:-.7px;margin:10px 0 8px}
.mkt-sec.ctr h2,.mkt-sec.ctr .dek{margin-left:auto;margin-right:auto;max-width:22ch}
.mkt-sec .dek{color:var(--muted);max-width:62ch;font-size:15.5px}
.mkt-sec.ctr .dek{max-width:60ch}
/* bento */
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:30px}
.bento .b{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
.bento .b.c3{grid-column:span 3}.bento .b.c2{grid-column:span 2}.bento .b.c4{grid-column:span 4}
.bento .b .ic{width:36px;height:36px;border-radius:10px;background:var(--accent-weak);color:var(--accent-ink);display:grid;place-items:center;font-size:17px;margin-bottom:12px}
.bento .b h3{font-size:16px;margin-bottom:6px;letter-spacing:-.3px}
.bento .b p{font-size:13.5px;color:var(--muted);margin:0}
.bminirow{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.bpill{font-size:11px;font-weight:600;padding:4px 9px;border-radius:7px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted)}
.bpill.g{color:var(--good);border-color:transparent;background:var(--good-weak)}
.bpill.w{color:var(--warn);border-color:transparent;background:var(--warn-weak)}
.bpill.a{color:var(--accent-ink);border-color:transparent;background:var(--accent-weak)}
.bdiff{background:#0d1017;border-radius:9px;padding:10px 12px;font-family:var(--font-m);font-size:11px;line-height:1.7;color:#c6cdd8;margin-top:14px}
.bdiff .p{color:#64d08a}.bdiff .c{color:#6b7686}
.bspark{display:flex;align-items:flex-end;gap:4px;height:46px;margin-top:14px}
.bspark i{flex:1;background:var(--accent-weak);border-radius:3px 3px 0 0}.bspark i.hi{background:var(--accent)}
/* alternating feature row */
.featrow{display:grid;grid-template-columns:1fr 1fr;gap:42px;align-items:center;padding:28px 0}
.featrow .fm{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);padding:18px}
.featrow h3{font-size:clamp(20px,2.4vw,27px);letter-spacing:-.5px;margin:10px 0 10px}
.featrow p{color:var(--muted);font-size:15px}
/* comparison */
.cmp{width:100%;border-collapse:collapse;margin-top:26px;font-size:13.5px;background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.cmp th,.cmp td{text-align:left;padding:14px 18px;border-bottom:1px solid var(--border)}
.cmp th{font-size:11.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--faint);font-weight:600;background:var(--surface-2)}
.cmp th:last-child{color:var(--accent-ink)}
.cmp td:first-child{font-weight:600}
.cmp td:last-child{background:var(--accent-weak)}
.cmp .y{color:var(--good);font-weight:600}.cmp .n{color:var(--faint)}
.cmp tr:last-child td{border-bottom:0}
.mktfoot{border-top:1px solid var(--border);margin-top:40px;padding:30px 0 50px;color:var(--faint);font-size:12.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
.ctaband{position:relative;overflow:hidden;background:linear-gradient(120deg,#171b34,#3b5bdb 55%,#7048e8);border-radius:22px;padding:52px 40px;color:#fff;text-align:center;margin:40px 0;box-shadow:0 30px 70px -26px rgba(59,91,219,.6)}
.ctaband h2{color:#fff;font-size:clamp(24px,3vw,32px);letter-spacing:-.5px}

/* ===================== homepage v2 (dark · kiro-class · animated) ===================== */
#s-home{
  --bg:#0b0f14; --surface:#121823; --surface-2:#161d29; --surface-3:#1c2432;
  --border:#212a38; --border-strong:#2d3a4d;
  --fg:#eef2f7; --muted:#8a94a6; --faint:#5f6b7e;
  --accent:#7CF29B; --accent-weak:rgba(124,242,155,.14); --accent-ink:#bdf5cf;
  --good:#4ade80; --good-weak:rgba(74,222,128,.14);
  --warn:#fbbf47; --warn-weak:rgba(251,191,71,.15);
  --crit:#f87171; --crit-weak:rgba(248,113,113,.14);
  --violet:#7CF29B; --violet-weak:rgba(124,242,155,.16); --violet-ink:#bdf5cf;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5);
  --shadow-lg:0 2px 8px rgba(0,0,0,.5),0 40px 90px -20px rgba(0,0,0,.85);
  --font-k:"Space Grotesk",system-ui,sans-serif;
  background:#0b0f14;color:var(--fg);color-scheme:dark;overflow-x:clip}
#s-home .logo{background:linear-gradient(135deg,#7CF29B,#43c96f)}
#s-home .btn.pri,#s-home .btn.good,#s-home .ksurfc .btn,#s-home .kinput .snd{color:#06321d!important}
#s-home h1,#s-home h2,#s-home .kdisp{font-family:var(--font-k);font-weight:700;letter-spacing:-.5px}
#s-home ::selection{background:rgba(124,242,155,.4);color:#fff}
.kwrap{max-width:1180px;margin:0 auto;padding:0 clamp(18px,4vw,28px)}
/* keyframes */
@keyframes kpulse{0%,100%{box-shadow:0 0 0 0 rgba(251,191,71,0)}50%{box-shadow:0 0 0 5px rgba(251,191,71,.16)}}
@keyframes kspin{to{transform:rotate(360deg)}}
@keyframes kfill{from{width:0}}
@keyframes kblink{0%,48%{opacity:1}52%,100%{opacity:0}}
@keyframes kdots{0%,20%{opacity:.18}50%{opacity:1}80%,100%{opacity:.18}}
@keyframes krise{from{transform:scaleY(.35);opacity:.5}}
@keyframes kfadein{from{opacity:0;transform:translateY(5px)}}
@keyframes kglow{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}
@keyframes ksweep{0%{transform:translateX(-130%)}60%,100%{transform:translateX(560%)}}
@keyframes kants{to{background-position:18px 0}}
@keyframes kbreath{0%,100%{box-shadow:0 0 0 0 rgba(124,242,155,0)}50%{box-shadow:0 0 0 4px rgba(124,242,155,.2)}}
@keyframes kping{0%{transform:scale(.6);opacity:.8}70%,100%{transform:scale(2.4);opacity:0}}
.kani{animation:kfadein .55s ease backwards}
@media(prefers-reduced-motion:reduce){#s-home *{animation:none!important}}
/* nav */
.knav{position:sticky;top:0;z-index:50;background:rgba(11,15,20,.74);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.06)}
.knav .in{display:flex;align-items:center;gap:10px;height:62px;max-width:1180px;margin:0 auto;padding:0 clamp(18px,4vw,28px)}
.knav .brandlogo b{color:#fff}
.knav .nlinks{display:flex;gap:2px;margin-left:16px}
.knav .nlinks a{font-size:13px;font-weight:600;color:rgba(255,255,255,.64);padding:7px 11px;border-radius:8px;cursor:pointer}
.knav .nlinks a:hover{color:#fff;background:rgba(255,255,255,.06)}
.knav .sp{flex:1}
.knav .btn{font-size:12.5px}
.knav .btn.ghost{color:rgba(255,255,255,.82);border-color:transparent}
.knav .btn.pri{background:var(--violet);border-color:var(--violet);color:#fff}

/* hero */
.khero{position:relative;overflow:clip;padding:clamp(44px,7vw,86px) 0 0}
.khero::before{content:"";position:absolute;inset:-180px -10% auto -10%;height:800px;z-index:0;pointer-events:none;transform-origin:50% 20%;animation:kglow 7s ease-in-out infinite;
  background:radial-gradient(44% 50% at 26% 4%,rgba(124,242,155,.42),transparent 70%),radial-gradient(40% 46% at 82% 0%,rgba(47,168,90,.32),transparent 72%),radial-gradient(30% 40% at 60% 28%,rgba(124,242,155,.2),transparent 70%)}

  -webkit-mask-image:radial-gradient(70% 58% at 40% 0%,#000,transparent 72%);mask-image:radial-gradient(70% 58% at 40% 0%,#000,transparent 72%)}

.kgrp{flex:5;display:flex;gap:10px;border:1px solid rgba(124,242,155,.5);background:rgba(124,242,155,.06);border-radius:16px;padding:16px 12px 12px;position:relative}

.kgrp .glab .lv{width:6px;height:6px;border-radius:50%;background:var(--violet);animation:kbreath 2s infinite}
.kconn{align-self:center;color:#334152;font-size:16px;flex:none;padding:0 1px;margin-top:26px}
.kloop{margin:20px auto 0;max-width:560px;border:1px dashed rgba(124,242,155,.45);border-radius:999px;padding:8px 18px;text-align:center;font-family:var(--font-m);font-size:11.5px;color:var(--violet-ink);background:linear-gradient(90deg,rgba(124,242,155,.09),rgba(124,242,155,.02));background-size:200% 100%}
/* feature rows */
.kfeat{display:grid;grid-template-columns:.92fr 1.12fr;gap:clamp(28px,5vw,60px);align-items:center;padding:clamp(38px,6vw,60px) 0}
.kfeat.rev{grid-template-columns:1.12fr .92fr}
.kfeat.rev .kfm{order:-1}
.kfeat h3{font-size:clamp(24px,3vw,33px);letter-spacing:-1px;color:#fff;margin:14px 0 14px;font-family:var(--font-k);line-height:1.08}
.kfeat p{color:rgba(255,255,255,.62);font-size:15.5px;line-height:1.55}
.kfeatlist{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.kfeatlist div{display:flex;align-items:center;gap:11px;font-size:14.5px;color:#d5d8df}
.kfeatlist .fi{color:var(--violet);font-size:14px;width:16px;text-align:center}
.kfeatlink{display:inline-flex;align-items:center;gap:6px;margin-top:22px;font-size:14px;font-weight:700;color:var(--violet-ink);cursor:pointer}
.kfeatlink:hover{gap:10px}
@media(max-width:820px){.kfeat,.kfeat.rev{grid-template-columns:1fr;gap:24px}.kfeat.rev .kfm{order:0}}
/* terminal mock */
.kterm{background:#0c1119;border:1px solid #1f2735;border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden;font-family:var(--font-m);font-size:11.5px;line-height:1.85}
.kterm .tbar{display:flex;align-items:center;gap:10px;padding:10px 13px;background:#111822;border-bottom:1px solid #1a2230;color:#565b68;font-size:11px}
.kterm .tbar .dots{display:flex;gap:6px}.kterm .tbar .dots i{width:10px;height:10px;border-radius:50%;background:#263142}
.kterm .tbar b{margin:0 auto;font-weight:400;color:#6b7180}
.ktbody{padding:14px 15px;color:#c5c9d2;overflow-x:auto}
.ktline{display:flex;gap:11px;white-space:pre-wrap}
.ktline+.ktline{margin-top:2px}
.ktgut{width:3px;border-radius:2px;flex:none}
.ktgut.v{background:#7CF29B}.ktgut.g{background:#4ade80}.ktgut.r{background:#f87171}.ktgut.n{background:transparent}
.kt-p{color:#aef2c4}.kt-b{color:#5aa9ff}.kt-g{color:#4ade80}.kt-r{color:#f87171}.kt-d{color:#565b68}.kt-y{color:#fbbf47}.kt-w{color:#e8e9ee}
.ktcur{display:inline-block;width:7px;height:13px;background:#aef2c4;vertical-align:-2px;animation:kblink 1.1s step-end infinite}
/* workflow / quality mock */
.kwf{background:#0e131c;border:1px solid #1f2735;border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden}
.kwf .wh{display:flex;align-items:center;justify-content:space-between;padding:14px 17px;border-bottom:1px solid #1a2230}
.kwf .wh h5{font-size:15px;font-family:var(--font-k);color:#fff}
.kwf .wh .st{font-family:var(--font-m);font-size:11px;color:var(--violet-ink);display:flex;align-items:center;gap:7px}
.kwf .wh .st .rr{width:10px;height:10px;border:1.6px solid var(--violet);border-right-color:transparent;border-radius:50%;animation:kspin .9s linear infinite}
.kwf .wb{padding:7px 9px}
.kwstep{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;font-size:13px}
.kwstep .wi{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:10px}
.kwstep .wi.ok{background:var(--good);color:#06240f}
.kwstep .wi.run{border:1.6px solid var(--violet);border-right-color:transparent;animation:kspin .9s linear infinite}
.kwstep .wi.idle{border:1.5px solid #2d3a4d;color:#565b68}
.kwstep b{color:#e8e9ee;font-weight:700}
.kwstep .ag{font-family:var(--font-m);font-size:11px;color:#6b7180}
.kwstep .bdg{font-family:var(--font-m);font-size:9.5px;padding:2px 7px;border-radius:5px;background:#11261a;color:var(--violet-ink);border:1px solid rgba(124,242,155,.3)}
.kwstep .pass{margin-left:auto;font-family:var(--font-m);font-size:10.5px;color:#6b7180}
.kwstep .pass.ok{color:var(--good)}
.kwsub{padding-left:28px}
.kwsub .kwstep{padding:6px 10px;font-size:12px}
/* memory mock */
.kmem{background:#0e131c;border:1px solid #1f2735;border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden}
.kmem .mh{display:flex;align-items:center;gap:9px;padding:12px 15px;background:#111822;border-bottom:1px solid #1a2230;color:#8b909c;font-size:12px}
.kmem .mh .fd{font-family:var(--font-m);font-size:11px}
.kmbody{padding:16px;display:flex;flex-direction:column;gap:12px}
.ktool{display:flex;align-items:center;gap:9px;background:#121a26;border:1px solid #1f2735;border-radius:9px;padding:9px 11px;font-size:12px}
.ktool .tn{font-family:var(--font-m);font-size:11px;color:#c5c9d2}
.ktool .fp{font-family:var(--font-m);font-size:11px;color:var(--violet-ink);background:#11261a;border-radius:5px;padding:1px 7px}
.ktool .ok{margin-left:auto;color:var(--good)}
.kmsg{font-size:13px;color:#d5d8df;line-height:1.5}
.kmsg b{color:#fff}
.kuser{align-self:flex-end;max-width:82%;background:#11261a;border:1px solid rgba(124,242,155,.3);border-radius:12px;padding:9px 13px;font-size:12.5px;color:#e4f3ea}
.kagent{display:flex;gap:9px;align-items:flex-start}
.kagent .kav{width:22px;height:22px;border-radius:6px;font-size:10px}
.kmemchip{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-m);font-size:11px;color:var(--good);background:var(--good-weak);border-radius:7px;padding:5px 10px;align-self:flex-start}
.ktype{display:inline-flex;gap:3px;align-items:center}
.ktype i{width:5px;height:5px;border-radius:50%;background:#6b7180;animation:kdots 1.4s infinite}
.ktype i:nth-child(2){animation-delay:.2s}.ktype i:nth-child(3){animation-delay:.4s}
/* surface cards */
.ksurf{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:40px}
.ksurfc{background:#0e131c;border:1px solid #1f2735;border-radius:16px;padding:7px 7px 18px;display:flex;flex-direction:column;transition:border-color .2s,transform .2s}
.ksurfc:hover{border-color:rgba(124,242,155,.4);transform:translateY(-3px)}
.ksurfprev{background:#090d13;border:1px solid #161d29;border-radius:11px;height:148px;overflow:hidden;padding:11px;font-family:var(--font-m);font-size:9.5px;color:#7a8191;line-height:1.7;position:relative}
.ksurfprev .pv-run{display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:6px;margin-bottom:5px;background:#0f141e}
.ksurfprev .pv-run.sel{background:#11261a}
.ksurfprev .dot{width:6px;height:6px;border-radius:50%;flex:none}
.ksurfc h4{font-size:14.5px;font-family:var(--font-k);color:#fff;margin:15px 11px 4px}
.ksurfc p{font-size:12.5px;color:#8b909c;margin:0 11px 16px;flex:1;line-height:1.5}
.ksurfc .btn{margin:0 11px;background:var(--violet);border-color:var(--violet);color:#fff}
@media(max-width:860px){.ksurf{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.ksurf{grid-template-columns:1fr}}
/* principles trio */
.ktrio{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-top:40px;text-align:left}
.ktrio .ic{font-size:24px;color:var(--violet)}
.ktrio h4{font-size:19px;font-family:var(--font-k);color:#fff;margin:14px 0 10px;letter-spacing:-.5px}
.ktrio p{color:rgba(255,255,255,.6);font-size:14.5px;line-height:1.55}
.ktrio a{color:var(--violet-ink);font-weight:700;font-size:13.5px;margin-top:12px;display:inline-flex;gap:5px;cursor:pointer}
@media(max-width:820px){.ktrio{grid-template-columns:1fr;gap:28px}}
/* pricing / monetization modes */
.kprice{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:44px;text-align:left}
.kpc{position:relative;display:flex;flex-direction:column;border:1px solid #1f2735;background:#0e131c;border-radius:18px;padding:24px 20px 22px}
.kpc.feat{border-color:rgba(124,242,155,.6);background:linear-gradient(180deg,rgba(124,242,155,.07),#0e131c 62%)}
.kpc .ptag{font-family:var(--font-m);font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#8b909c}
.kpc.feat .ptag{color:var(--violet-ink)}
.kpc .pnm{font-family:var(--font-k);font-size:19px;color:#fff;margin:9px 0 3px;letter-spacing:-.5px}
.kpc .pbrings{font-size:12.5px;color:rgba(255,255,255,.56);line-height:1.45;min-height:36px}
.kpc .pprice{font-family:var(--font-k);font-size:20px;color:#fff;margin:14px 0 2px;letter-spacing:-.5px}
.kpc .pprice small{display:block;font-family:var(--font-b,inherit);font-size:11.5px;color:#8b909c;font-weight:400;letter-spacing:0;margin-top:3px}
.kpc ul{list-style:none;margin:15px 0 0;padding:0;display:flex;flex-direction:column;gap:9px;flex:1}
.kpc li{font-size:12.6px;color:rgba(255,255,255,.72);line-height:1.4;display:flex;gap:8px;align-items:flex-start}
.kpc li::before{content:"✓";color:var(--violet-ink);font-weight:700;flex:none}
.kpc .pcta{margin-top:18px}
.kpbadge{position:absolute;top:-10px;right:16px;background:#0b2016;border:1px solid rgba(124,242,155,.6);color:var(--violet-ink);font-family:var(--font-m);font-size:10px;font-weight:700;letter-spacing:.3px;padding:3px 10px;border-radius:999px}
.kpfoot{color:rgba(255,255,255,.5);font-size:12.5px;margin-top:20px;max-width:60ch;margin-left:auto;margin-right:auto}
@media(max-width:980px){.kprice{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.kprice{grid-template-columns:1fr}}
/* faq */
.kfaq{max-width:860px;margin:40px auto 0}
.kfq{border-bottom:1px solid #1a2230}
.kfq summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:21px 2px;font-family:var(--font-k);font-size:clamp(15px,2vw,19px);font-weight:700;color:#e8e9ee}
.kfq summary::-webkit-details-marker{display:none}
.kfq summary .pl{color:var(--violet);font-size:21px;transition:transform .2s;flex:none}
.kfq[open] summary .pl{transform:rotate(45deg)}
.kfq .ans{padding:0 2px 21px;color:rgba(255,255,255,.6);font-size:14.5px;line-height:1.6;max-width:72ch}
/* big cta */
.kcta{position:relative;overflow:hidden;border-radius:26px;margin:40px 0;padding:clamp(46px,7vw,86px) 24px;text-align:center;background:linear-gradient(135deg,#2fa85a,#7CF29B 52%,#aef2c4)}
.kcta::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.09) 1px,transparent 1px);background-size:42px 42px;-webkit-mask-image:radial-gradient(70% 90% at 50% 130%,#000,transparent);mask-image:radial-gradient(70% 90% at 50% 130%,#000,transparent)}
.kcta h2{position:relative;z-index:1;color:#06321d;font-size:clamp(29px,4.4vw,50px);letter-spacing:-1.5px;line-height:1.03}
.kcta p{position:relative;z-index:1;color:rgba(6,40,22,.82);font-size:16px;margin:16px auto 28px;max-width:46ch}
.kctabtns{position:relative;z-index:1;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.kctabtns .btn.w{background:#06321d;color:#aef2c4;border-color:#06321d;font-weight:700}
.kctabtns .btn.o{background:rgba(6,40,22,.12);border:1px solid rgba(6,40,22,.35);color:#06321d}
/* footer */
.kfoot{border-top:1px solid #1a2230;padding:54px 0 30px;margin-top:10px}
.kfootgrid{display:grid;grid-template-columns:1.5fr repeat(4,1fr);gap:30px}
.kfoot .fcol h6{font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:#565b68;font-weight:700;font-family:var(--font-m);margin:0 0 14px}
.kfoot .fcol a{display:block;font-size:13.5px;color:#9aa0ad;padding:5px 0;cursor:pointer}
.kfoot .fcol a:hover{color:#fff}
.kfoot .fbrand p{font-size:13px;color:#6b7180;margin:14px 0 0;max-width:30ch;line-height:1.5}
.kfootsoc{display:flex;gap:10px;margin-top:16px}
.kfootsoc i{width:33px;height:33px;border-radius:9px;border:1px solid #212a38;display:grid;place-items:center;color:#8b909c;font-size:13px;cursor:pointer;font-style:normal;font-family:var(--font-k);font-weight:700}
.kfootsoc i:hover{color:#fff;border-color:#2d3a4d}
.kfootbot{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:44px;padding-top:22px;border-top:1px solid #1a2230;font-size:12px;color:#565b68}
.kfootbot .lg{display:flex;gap:18px;flex-wrap:wrap}
.kfootbot .lg a{cursor:pointer}.kfootbot .lg a:hover{color:#9aa0ad}
@media(max-width:820px){.kfootgrid{grid-template-columns:1fr 1fr}.kfoot .fbrand{grid-column:1/-1}}
/* lifecycle packages (reuse .chain) */
.kpkgs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:38px;text-align:left}
.kpkgc{background:#0e131c;border:1px solid #1f2735;border-radius:14px;padding:18px}
.kpkgc h4{font-size:14px;font-family:var(--font-k);color:#fff;margin-bottom:14px}
.kpkgc p{font-size:12.5px;color:#8b909c;margin:12px 0 0;line-height:1.5}
.kpkgc .chain{margin:0 -7px}
.kpkgc .chain .cn{min-width:0}
.kpkgc .chain .cbox{padding:8px 2px;font-size:9.5px;white-space:nowrap;letter-spacing:-.3px}
.kpkgc .chain .arw{font-size:9px;padding:0}
@media(max-width:1120px){.kpkgs{grid-template-columns:1fr 1fr}}
@media(max-width:820px){.kpkgs{grid-template-columns:1fr}}

/* ===================== lifecycle chain visual ===================== */
.chain{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:4px 0;min-width:0}
.chain .cn{flex:1;min-width:84px;text-align:center;position:relative}
.chain .cbox{border:1.5px solid var(--border-strong);border-radius:10px;padding:10px 6px;background:var(--surface);font-weight:600;font-size:12.5px}
.chain .cn .cs{font-size:10px;color:var(--faint);margin-top:4px;display:block}
.chain .cn.on .cbox{border-color:var(--accent);background:var(--accent-weak);color:var(--accent-ink)}
.chain .cn.you .cbox{border-style:dashed;opacity:.9;color:var(--muted)}
.chain .cn.off .cbox{opacity:.4}
.chain .arw{display:flex;align-items:center;color:var(--border-strong);font-size:15px;padding:0 2px;align-self:center}
.chain .cn.on .cs{color:var(--accent)}

/* ===================== app shell ===================== */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh;min-height:100dvh}
/* ===== Signal identity scoped to the app shell (ink-navy · green · grotesk) ===== */
#appshell{
  --bg:#0b0f14; --surface:#121823; --surface-2:#161d29; --surface-3:#1c2432;
  --border:#212a38; --border-strong:#2d3a4d;
  --fg:#eef2f7; --muted:#8a94a6; --faint:#5f6b7e;
  --accent:#7CF29B; --accent-weak:rgba(124,242,155,.14); --accent-ink:#bdf5cf;
  --good:#4ade80; --good-weak:rgba(74,222,128,.14);
  --warn:#fbbf47; --warn-weak:rgba(251,191,71,.15);
  --crit:#f87171; --crit-weak:rgba(248,113,113,.14);
  --violet:#7CF29B; --violet-weak:rgba(124,242,155,.16);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5);
  --shadow-lg:0 2px 8px rgba(0,0,0,.5),0 40px 90px -20px rgba(0,0,0,.85);
  color-scheme:dark;background:var(--bg);color:var(--fg);overflow-x:clip}
#appshell .btn.pri,#appshell .btn.good{color:var(--btn-ink)!important}
#appshell .st.done{color:var(--btn-ink)}
#appshell .node .nix{color:var(--btn-ink)}
#appshell .msg.ag .av{color:var(--btn-ink)}
#appshell .bar>span{background:linear-gradient(90deg,var(--accent),#43c96f)}
#appshell .nav .badge{color:#2a1a00}
#appshell .toggle::after{background:#eef2f7}
.side{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;min-width:0}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.brand b{font-family:var(--font-d);font-size:16px;letter-spacing:.2px}
.brand .sub{font-size:11px;color:var(--faint);letter-spacing:.3px}
.nav{padding:12px 12px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav .lbl{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);padding:12px 10px 6px}
.nav button{all:unset;display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:500;font-size:13.5px}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button.on{background:var(--accent-weak);color:var(--accent-ink);font-weight:600}
.nav .ic{width:16px;text-align:center;flex:none;opacity:.9}
.nav button.on .ic{opacity:1}
.nav .badge{margin-left:auto;font-size:10.5px;font-weight:700;background:var(--warn);color:#fff;border-radius:999px;padding:1px 7px}
.sidefoot{margin-top:auto;padding:14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.wallet{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer}
.wallet .top{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted)}
.wallet .bal{font-family:var(--font-d);font-size:18px;color:var(--fg);font-weight:600}
.bar{height:6px;border-radius:4px;background:var(--surface-3);margin-top:8px;overflow:hidden}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#8ea2ff)}
.persona{display:flex;gap:6px}
.persona button{all:unset;flex:1;text-align:center;font-size:11.5px;padding:6px 4px;border-radius:7px;cursor:pointer;color:var(--muted);border:1px solid var(--border)}
.persona button.on{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
.footlbl{font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--faint);font-weight:600;padding:2px 2px 0}
/* user profile block (sidebar) */
.userprof{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2)}
.uavatar{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px;background:linear-gradient(135deg,var(--accent),#43c96f);color:var(--btn-ink);position:relative;overflow:hidden}
.uavatar.photo{color:transparent;background-size:cover;background-position:center;background-repeat:no-repeat}
.umhead .uavatar{cursor:pointer}
.uavatar .camov{position:absolute;inset:0;display:grid;place-items:center;font-size:8px;font-weight:700;letter-spacing:.3px;color:#fff;background:rgba(0,0,0,.45);opacity:0;transition:opacity .12s}
.umhead .uavatar:hover .camov{opacity:1}
/* organisation settings */
.logo.photo,.orglogo.photo{color:transparent!important;background-size:cover!important;background-position:center!important;background-repeat:no-repeat!important}
.orgid{display:flex;gap:16px;align-items:flex-start;margin:4px 0 16px}
.orglogo{width:66px;height:66px;border-radius:15px;flex:none;display:grid;place-items:center;font-family:var(--font-d);font-weight:700;font-size:21px;background:linear-gradient(135deg,var(--accent),#43c96f);color:var(--btn-ink);cursor:pointer;position:relative;overflow:hidden}
.orglogo .camov{position:absolute;inset:0;display:grid;place-items:center;font-size:9px;font-weight:700;letter-spacing:.3px;color:#fff;background:rgba(0,0,0,.45);opacity:0;transition:opacity .12s}
.orglogo:hover .camov{opacity:1}
.orgfields{flex:1;min-width:0;display:flex;flex-direction:column;gap:11px}
.orgfields .tag{display:block;margin-bottom:5px}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.frow2{grid-template-columns:1fr}.orgid{flex-direction:column;align-items:center;text-align:center}}
/* keys & secrets */
.secretrow{display:grid;grid-template-columns:30px 1.5fr 1.4fr auto auto auto;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--border)}
.secretrow:first-of-type{border-top:0}
.secretrow .sic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--border);font-size:13px}
.secretrow .smeta{min-width:0}
.secretrow .smeta b{font-size:13px;display:block}
.secretrow .smeta span{font-size:11.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.secretrow .sval{font-family:var(--font-m);font-size:12px;color:var(--fg);background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:5px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.secretrow .swhen{font-size:11px;color:var(--faint);white-space:nowrap}
.secretrow .sact{display:flex;gap:4px}
.iconbtn.sm{width:28px;height:28px;font-size:12px}
.iconbtn.danger:hover{color:var(--crit);border-color:var(--crit)}
.setbody.locked .iconbtn{opacity:.45;pointer-events:none}
@media(max-width:860px){.secretrow{grid-template-columns:30px 1fr auto;row-gap:7px}.secretrow .sval{grid-column:2/-1}.secretrow .swhen{display:none}.secretrow .sact{grid-column:2/-1;justify-content:flex-start}}
.userprof .upmeta{min-width:0}
.userprof .upmeta b{font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.userprof .upmeta span{font-size:11px;color:var(--muted)}
.navtgl{all:unset;cursor:pointer;display:flex;align-items:center;gap:9px;justify-content:center;padding:8px;border-radius:8px;color:var(--muted);border:1px solid var(--border);font-size:12.5px;font-weight:600}
.navtgl:hover{color:var(--fg);border-color:var(--border-strong)}
/* topbar user/account menu */
.usermenu{position:relative}
.usermenu .uavatar{cursor:pointer;width:34px;height:34px;font-size:14px}
.usermenu .umpop{position:absolute;top:calc(100% + 8px);right:0;width:248px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;z-index:70;display:none}
.usermenu.open .umpop{display:block}
.usermenu.open .uavatar{box-shadow:0 0 0 3px var(--accent-weak)}
.umhead{display:flex;align-items:center;gap:11px;padding:9px 10px 11px}
.umhead .uavatar.lg{width:38px;height:38px;font-size:15px}
.umhead b{font-size:13px;display:block}
.umhead span{font-size:11.5px;color:var(--muted)}
.umsec{font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--faint);font-weight:700;padding:6px 10px 4px;border-top:1px solid var(--border)}
.umopt{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;font-size:12.5px;color:var(--fg);box-sizing:border-box;width:100%}
.umopt:hover{background:var(--surface-2)}
.umopt .umck{margin-left:auto;color:var(--accent-ink);font-weight:700;opacity:0}
.umopt.sel .umck{opacity:1}
.umopt.sel{color:var(--accent-ink);font-weight:600}
.umdiv{height:1px;background:var(--border);margin:5px 6px}
/* settings role banner + locked sections */
.rolebanner{display:flex;gap:11px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:11px 14px;margin-bottom:14px}
.rolebanner .ra{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--accent);color:var(--btn-ink)}
.rolebanner b{font-size:13px}
.rolebanner .rb-d{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.45}
.hintbar.lock{background:var(--warn-weak);color:var(--warn);border-color:transparent}
.setbody.locked .btn,.setbody.locked .section-h button{opacity:.45;pointer-events:none}
.secret-empty{font-size:12.5px;color:var(--faint);padding:14px 4px}
/* add / rotate secret modal */
.modal{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:18px}
.modal.open{display:flex}
.modal-bd{position:absolute;inset:0;background:rgba(2,6,12,.58);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.modal-card{position:relative;width:min(460px,100%);background:var(--surface);border:1px solid var(--border-strong);border-radius:16px;box-shadow:var(--shadow);max-height:90vh;overflow:auto;animation:modpop .16s ease}
@keyframes modpop{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.modal-h h3{font-size:16px;flex:1}
.modal-body{padding:4px 18px 8px}
.modal-sub{font-size:12.5px;color:var(--muted);margin:0 0 15px;line-height:1.5}
.field{display:block;margin-bottom:13px}
.field>span{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:5px;letter-spacing:.2px}
.field input,.field select{all:unset;box-sizing:border-box;width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-size:13px;color:var(--fg)}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.field input.mono{font-family:var(--font-m);font-size:12.5px}
.field small{display:block;font-size:11px;color:var(--faint);margin-top:6px;line-height:1.45}
.field.err input{border-color:var(--crit);box-shadow:0 0 0 3px var(--crit-weak)}
.secret-input{display:flex;gap:7px;align-items:stretch}
.secret-input input{flex:1}
.secret-input .iconbtn{width:38px;flex:none}
.modal-foot{display:flex;gap:9px;justify-content:flex-end;padding:12px 18px 18px;border-top:1px solid var(--border);margin-top:6px}
/* editable model-per-stage select */
.msel{font-family:var(--font-m);font-size:12.5px;color:var(--fg);background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:5px 8px;cursor:pointer;max-width:210px}
.msel:hover{border-color:var(--border-strong)}
.msel:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* lifecycle package picker */
.pkgpick{display:flex;flex-direction:column;gap:8px}
.pkgopt{all:unset;cursor:pointer;display:block;border:1.5px solid var(--border);border-radius:11px;padding:11px 13px}
.pkgopt:hover{border-color:var(--border-strong);background:var(--surface-2)}
.pkgopt.sel{border-color:var(--accent);background:var(--accent-weak)}
.pkgo-h{display:flex;align-items:center;gap:9px}
.pkgo-h b{font-size:13.5px}
.pkgo-ck{margin-left:auto;color:var(--accent-ink);font-weight:700;opacity:0}
.pkgopt.sel .pkgo-ck{opacity:1}
#genModal .modal-card{width:min(560px,100%)}
.pkgo-chain{margin:9px 0 6px;transform:scale(.8);transform-origin:left;overflow-x:auto}
.pkgo-d{font-size:11.5px;color:var(--muted)}
/* billing: top-up + invoices */
.topup-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.topup-opt{all:unset;cursor:pointer;text-align:center;border:1.5px solid var(--border);border-radius:10px;padding:12px 8px;font-weight:700;font-size:14px;color:var(--fg)}
.topup-opt span{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:3px}
.topup-opt:hover{border-color:var(--border-strong)}
.topup-opt.sel{border-color:var(--accent);background:var(--accent-weak);color:var(--accent-ink)}
.invtable{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.invrow{display:grid;grid-template-columns:1.2fr 1fr .9fr 1fr auto;gap:8px;align-items:center;padding:10px 12px;font-size:12.5px;border-top:1px solid var(--border)}
.invrow:first-child{border-top:0}
.invhead{background:var(--surface-2);font-size:10.5px;letter-spacing:.3px;text-transform:uppercase;color:var(--faint);font-weight:600}
/* collapsed sidebar (desktop only) */
@media (min-width:861px){
  .app.navco{grid-template-columns:68px 1fr}
  .app.navco .brand{justify-content:center;padding:18px 0 14px;gap:0}
  .app.navco .brand .bmeta{display:none}
  .app.navco .nav{padding:12px 10px;overflow:visible}
  .app.navco .side{overflow:visible;z-index:45}
  .app.navco .nav button{justify-content:center;font-size:0;gap:0;padding:10px 0}
  .app.navco .nav button .ic{font-size:16px;opacity:1}
  .app.navco .nav .badge{display:none}
  .app.navco .nav .lbl{display:none}
  .app.navco .sidefoot{padding:12px 10px}
  .app.navco .wallet .top,.app.navco .wallet .bal{display:none}
  .app.navco .wallet{padding:8px}
  .app.navco .footlbl,.app.navco .persona{display:none}
  .app.navco .userprof{justify-content:center;padding:8px 0}
  .app.navco .userprof .upmeta{display:none}
  .app.navco .navtgl .nt-l{display:none}
  /* hover tooltips for the collapsed icon rail */
  .app.navco .nav button{position:relative}
  .app.navco .nav button::after{content:attr(data-tip);position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%) scale(.96);transform-origin:left center;background:var(--fg);color:var(--bg);font-size:12px;font-weight:600;letter-spacing:.1px;padding:5px 9px;border-radius:7px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s ease,transform .12s ease;z-index:200;box-shadow:var(--shadow-lg)}
  .app.navco .nav button::before{content:"";position:absolute;left:calc(100% + 6px);top:50%;transform:translateY(-50%);border:5px solid transparent;border-right-color:var(--fg);opacity:0;pointer-events:none;transition:opacity .12s ease;z-index:90}
  .app.navco .nav button:hover::after{opacity:1;transform:translateY(-50%) scale(1)}
  .app.navco .nav button:hover::before{opacity:1}
}
/* no stray selection / default focus ring on shell controls — use a themed ring instead */
.uavatar,.nav button,.navtgl,.persona button,.footlbl,.brand{user-select:none;-webkit-user-select:none}
#appshell .nav button:focus-visible,#appshell .navtgl:focus-visible,#appshell .persona button:focus-visible,#appshell .uavatar:focus-visible,#appshell .iconbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:9px}
#appshell .nav button:focus:not(:focus-visible),#appshell .navtgl:focus:not(:focus-visible){outline:none}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);
  padding-block:12px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar .tt{display:flex;flex-direction:column;min-width:0}
.topbar h1{font-size:17px}
.topbar .crumb{font-size:12px;color:var(--faint)}
.spacer{flex:1}
.content{padding-block:22px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));flex:1}

/* ===================== tasks list ===================== */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.tasktable{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.taskrow{display:grid;grid-template-columns:1.6fr 1fr 150px 108px 92px;gap:14px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.taskrow:last-child{border-bottom:0}
.taskrow:hover{background:var(--surface-2)}
.taskrow.head{background:var(--surface-2);cursor:default;font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--faint);font-weight:600}
.taskrow.head:hover{background:var(--surface-2)}
.taskrow.head .col-cost{text-align:right}
.tasktitle{font-weight:600;font-size:14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tasktitle .mta{font-size:11.5px;color:var(--faint);font-weight:400;display:flex;gap:8px;align-items:center}
.ty{font-size:10.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;padding:2px 7px;border-radius:5px}
.ty.feat{background:var(--accent-weak);color:var(--accent-ink)}
.ty.bug{background:var(--crit-weak);color:var(--crit)}
.ty.spike{background:var(--violet-weak);color:var(--violet)}
.ty.infra{background:var(--warn-weak);color:var(--warn)}
.minidag{display:flex;gap:3px;align-items:center}
.minidag i{width:16px;height:6px;border-radius:3px;background:var(--surface-3)}
.minidag i.done{background:var(--good)}.minidag i.run{background:var(--accent)}.minidag i.gate{background:var(--warn)}.minidag i.fail{background:var(--crit)}

/* ===================== run console ===================== */
.work{display:grid;grid-template-columns:230px minmax(300px,1fr) minmax(300px,398px);gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel .ph{padding:13px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.panel .ph h3{font-size:13.5px}
.panel .pb{padding:14px 15px}
.railitem{display:flex;align-items:center;gap:11px;padding:10px 15px;cursor:pointer;border-left:3px solid transparent}
.railitem:hover{background:var(--surface-2)}
.railitem.sel{background:var(--accent-weak);border-left-color:var(--accent)}
.st{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;border:1.5px solid var(--border-strong);color:var(--muted)}
.st.done{background:var(--good);border-color:var(--good);color:#fff}
.st.run{background:var(--accent-weak);border-color:var(--accent);color:var(--accent)}
.st.gate{background:var(--warn-weak);border-color:var(--warn);color:var(--warn)}
.st.loop{background:var(--crit-weak);border-color:var(--crit);color:var(--crit)}
.st.idle{opacity:.6}
.railitem .nm{font-size:13px;font-weight:600}
.railitem .meta{font-size:11px;color:var(--faint)}
/* DAG */
.dag{padding:16px 10px}
.node{position:relative;margin:0 auto;width:min(100%,320px);background:var(--surface);border:1.5px solid var(--border);border-radius:11px;padding:10px 13px;cursor:pointer}
.node + .conn{height:22px;width:2px;background:var(--border-strong);margin:0 auto}
.node.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.node.gate{border-color:var(--warn)}
.node.loop{border-color:var(--crit)}
.node.idle{opacity:.55}
.node .row1{display:flex;align-items:center;gap:9px}
.node .nix{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}
.node .ttl{font-weight:600;font-size:13px}
.node .art{font-size:11px;color:var(--muted);margin-top:4px;padding-left:27px}
.node .gatetag{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--accent-ink)}
.node.gate .gatetag{color:var(--warn)}.node.loop .gatetag{color:var(--crit)}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px var(--warn-weak)}50%{box-shadow:0 0 0 6px transparent}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.loopnote{text-align:center;font-size:10.5px;color:var(--crit);margin:7px auto 0}
/* segmented control (Flow / Value stream) */
.segctl{display:inline-flex;gap:2px;background:var(--surface-3);border:1px solid var(--border);border-radius:8px;padding:2px}
.segctl .seg{all:unset;cursor:pointer;font-size:11px;font-weight:600;color:var(--muted);padding:5px 10px;border-radius:6px;white-space:nowrap}
.segctl .seg:hover{color:var(--fg)}
.segctl .seg.on{background:var(--surface);color:var(--accent-ink);box-shadow:0 1px 2px rgba(0,0,0,.25)}
/* GoCD-style Value Stream Map (rendered in Signal craft) */
.vsm{overflow-x:auto;padding:4px 2px 6px}
.vsm-rail{display:flex;align-items:center;min-width:max-content}
.vmat{flex:none;width:72px;height:72px;border-radius:50%;border:1.5px dashed var(--border-strong);background:var(--surface-2);display:grid;place-items:center;text-align:center;font-size:9.5px;color:var(--muted);line-height:1.25}
.vmat b{display:block;font-size:13px;color:var(--fg);font-family:var(--font-m)}
.vedge{flex:none;width:26px;height:2px;background:var(--border-strong);position:relative}
.vedge::after{content:"";position:absolute;right:-1px;top:-3px;border:4px solid transparent;border-left-color:var(--border-strong)}
.vnode{flex:none;width:130px;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:9px 10px;cursor:pointer}
.vnode.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.vnode.gate{border-color:var(--warn)}.vnode.loop{border-color:var(--crit)}.vnode.idle{opacity:.5}
.vnode .vn-h{display:flex;align-items:center;gap:7px}
.vnode .vn-ix{width:16px;height:16px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:9px;font-weight:700;color:#fff}
.vnode .vn-nm{font-size:12px;font-weight:600;line-height:1.1}
.vnode .vn-g{font-size:9.5px;color:var(--faint);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vnode .vn-bar{height:5px;border-radius:3px;margin-top:8px;background:var(--border-strong)}
.vnode .vn-bar.done{background:var(--good)}.vnode .vn-bar.gate{background:var(--warn)}.vnode .vn-bar.loop{background:var(--crit)}
.vloop{text-align:center;font-size:10.5px;color:var(--crit);margin-top:12px}
/* GoCD-style console: breadcrumb + timed task rows */
.gcrumb{font-family:var(--font-m);font-size:11px;color:var(--muted);margin-bottom:9px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gcrumb b{color:var(--fg);font-weight:600}.gcrumb .sep{color:var(--faint)}
.gterm{background:#0d1017;border-radius:9px;padding:7px 5px;font-family:var(--font-m);font-size:11.5px;color:#c6cdd8;overflow-x:auto}
.ghdr{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:10px;color:#8a94a6;text-transform:uppercase;letter-spacing:.4px}
.ghdr .gtot{margin-left:auto;color:#64d08a;text-transform:none;letter-spacing:0;font-size:11px}
.gline{display:flex;align-items:center;gap:9px;padding:5px 10px;border-radius:6px}
.gline:hover{background:rgba(255,255,255,.035)}
.gline .gp{color:#6f86ff;flex:none}
.gline .gcmd{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gline .gres{flex:none;font-size:10.5px}
.gline .gres.ok,.gline .gres.add{color:#64d08a}.gline .gres.warn{color:#e4b46a}
.gline .took{flex:none;font-size:10px;color:#6b7686;min-width:62px;text-align:right}
/* stage inspector tabs */
.tabbar{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--border);padding:0 8px}
.tabbar button{all:unset;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);padding:11px 11px;border-bottom:2px solid transparent;white-space:nowrap}
.tabbar button:hover{color:var(--fg)}
.tabbar button.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
.tabpane{padding:15px}
.tabpane.editing{background:var(--surface-2)}
.tabbar .editbtn{all:unset;cursor:pointer;margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--accent-ink);padding:9px 11px;border-radius:7px}
.tabbar .editbtn:hover{background:var(--surface-2)}
.editbody{outline:2px dashed var(--accent);outline-offset:4px;border-radius:8px;padding:8px}
.editbody:focus{outline:2px dashed var(--accent)}
.editban{display:flex;align-items:center;gap:10px;background:var(--warn-weak);color:var(--warn);border:1px solid var(--warn);border-radius:9px;padding:8px 11px;font-size:12px;font-weight:600;margin-bottom:12px}
.editban .ebactions{margin-left:auto;display:flex;gap:7px;flex:none}
#prdCard.editing,#gtmBody.editing{outline:2px dashed var(--accent);outline-offset:5px;border-radius:12px}
/* manual surfaces + comments + SSO console */
.mhead{margin-bottom:12px}
.mh-t{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.mh-d{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
.ssobar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:8px 11px;margin:0 0 14px}
.ssolbl{font-size:11.5px;color:var(--faint);font-weight:600}
.revbar{display:flex;align-items:center;gap:8px;font-size:13px;margin:0 0 10px}
.revfile{font-family:var(--font-m);font-size:11.5px;color:var(--muted);margin-bottom:6px}

.msub{display:flex;gap:4px;overflow-x:auto;margin-bottom:10px;flex-wrap:wrap}

.mcon.mdev{display:flex;gap:14px;align-items:flex-start}
.mrow{display:flex;align-items:center;gap:8px;font-family:var(--font-m);font-size:11.5px;flex-wrap:wrap}

.cmts{margin-top:16px;border-top:1px solid var(--border);padding-top:12px}

.xframe{width:70px;height:48px;border:1px solid var(--border);border-radius:6px;background:linear-gradient(160deg,var(--accent-weak),var(--surface))}
.ssohdr{background:var(--accent-weak);color:var(--accent-ink);border:1px solid var(--accent);border-radius:8px;padding:8px 11px;font-size:12px;font-weight:600;margin-bottom:4px}
.ssosub{font-size:11.5px;color:var(--muted);margin:0 0 12px}
.xcon{border:1px solid var(--border);border-radius:9px;padding:11px;background:var(--surface)}
.xcrow{font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--border)}.xcrow:last-child{border-bottom:0}
.xdiff{font-family:var(--font-m);font-size:11.5px;margin:8px 0}
.xln.add{color:var(--good)}.xln.del{color:var(--crit)}
.xcbtns{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.xterm{font-family:var(--font-m);font-size:11.5px;background:#0d1017;color:#c6cdd8;border-radius:8px;padding:11px;line-height:1.7}
.xterm .d{color:#6b7180}.xterm .g{color:#7CF29B}.xterm .cur{color:#7CF29B}
.xdoc{border:1px solid var(--border);border-radius:8px;padding:12px}.xdoc h4{margin:0 0 6px}.xdoc p{font-size:12.5px;color:var(--muted);margin:0}
.term{background:#0d1017;border-radius:9px;padding:12px 14px;font-family:var(--font-m);font-size:11.5px;line-height:1.75;color:#c6cdd8;overflow-x:auto}
.term .pr{color:#6f86ff}.term .ok{color:#64d08a}.term .wr{color:#e4b46a}.term .dim{color:#6b7686}
.trace{display:flex;flex-direction:column;gap:10px}
.turn{border:1px solid var(--border);border-radius:9px;padding:10px 12px;background:var(--surface-2)}
.turn .th{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.turn p{margin:0;font-size:12.5px;color:var(--fg)}
.toolcall{font-family:var(--font-m);font-size:11.5px;background:var(--surface-3);border-radius:6px;padding:5px 9px;margin-top:7px;color:var(--accent-ink)}
.qbar{margin:9px 0}
.qbar .ql{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.qbar .qt{height:8px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.qbar .qt>span{display:block;height:100%;background:var(--good)}
.qbar .qt>span.mid{background:var(--warn)}
.scorebig{font-family:var(--font-d);font-size:40px;font-weight:700;letter-spacing:-1px;line-height:1}
.cov{display:flex;flex-direction:column;gap:7px}
.covitem{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2)}
.covitem .mk{flex:none;margin-top:1px}
.covitem .mk.ok{color:var(--good)}.covitem .mk.def{color:var(--warn)}.covitem .mk.no{color:var(--crit)}
.vid{position:relative;background:#0d1017;border-radius:10px;aspect-ratio:16/9;display:grid;place-items:center;overflow:hidden;border:1px solid var(--border)}
.vid .play{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;color:#fff;font-size:20px;backdrop-filter:blur(2px);border:1px solid rgba(255,255,255,.25)}
.vid .scrub{position:absolute;left:12px;right:12px;bottom:12px;height:4px;border-radius:3px;background:rgba(255,255,255,.2)}
.vid .scrub>span{display:block;height:100%;width:38%;background:#fff;border-radius:3px}
.vid .cap{position:absolute;top:10px;left:12px;font-family:var(--font-m);font-size:11px;color:rgba(255,255,255,.8)}
.shots{display:flex;gap:8px;margin-top:10px}
.shots i{flex:1;aspect-ratio:4/3;border-radius:7px;background:linear-gradient(135deg,var(--surface-3),var(--surface-2));border:1px solid var(--border)}
.costrow{display:grid;grid-template-columns:1fr 70px 80px 70px;gap:8px;font-size:12.5px;padding:8px 0;border-bottom:1px dashed var(--border);align-items:center}
.costrow.h{font-size:10.5px;letter-spacing:.3px;text-transform:uppercase;color:var(--faint);font-weight:600}
.costrow.h,.costrow:last-child{border-bottom:0}
.costrow .mono{text-align:right}
/* conversation */
.convo{display:flex;flex-direction:column;gap:10px;max-height:360px;overflow:auto;padding-right:2px}
.msg{display:flex;gap:9px;align-items:flex-start}
.msg .av{width:26px;height:26px;border-radius:7px;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700}
.msg.ag .av{background:var(--accent);color:#fff}
.msg.me .av{background:var(--surface-3);color:var(--fg)}
.msg .bub{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:8px 11px;font-size:12.8px}
.msg.me .bub{background:var(--accent-weak);border-color:transparent}
.msg .who{font-size:10.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px}
.composer{display:flex;gap:8px;margin-top:12px;align-items:center}
.composer .inp{flex:1}
.attach{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.attach .at{display:flex;align-items:center;gap:6px;font-size:11.5px;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:5px 9px;color:var(--muted)}
.gatebox{border:1.5px solid var(--warn);background:var(--warn-weak);border-radius:11px;padding:13px 14px;margin-top:12px}
.gatebox.rbac{border-color:var(--violet);background:var(--violet-weak)}
.gatebox .gt{font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--warn);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.gatebox.rbac .gt{color:var(--violet)}
.approvers{display:flex;gap:8px;margin:8px 0}
.approvers .ap{flex:1;text-align:center;font-size:11.5px;border:1px solid var(--border);border-radius:8px;padding:7px;background:var(--surface)}
.approvers .ap.ok{border-color:var(--good);color:var(--good)}
.approvers .ap.wait{border-color:var(--warn);color:var(--warn)}

/* ===================== onboarding wizard ===================== */
.wiz{max-width:860px;margin:0 auto;padding:26px 22px 60px}
.wizhead{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.wizsteps{display:flex;gap:6px;margin:18px 0 26px;flex-wrap:wrap}
.wizsteps .ws{flex:1;min-width:90px;font-size:11.5px;font-weight:600;color:var(--faint);padding-bottom:9px;border-bottom:2px solid var(--border)}
.wizsteps .ws.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
.wizsteps .ws.done{color:var(--good);border-bottom-color:var(--good)}
.wizpane{min-height:320px}
.pkggrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:8px}
.pkgcard{border:1.5px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;background:var(--surface)}
.pkgcard:hover{border-color:var(--border-strong)}
.pkgcard.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.pkgcard h4{font-size:14px;display:flex;align-items:center;gap:8px}
.pkgcard p{font-size:12px;color:var(--muted);margin:5px 0 0}
.wnav{display:flex;justify-content:space-between;margin-top:26px;gap:12px}

/* ===================== settings tabs ===================== */
.subnav{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--border)}
.subnav button{all:unset;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);padding:10px 13px;border-bottom:2px solid transparent}
.subnav button:hover{color:var(--fg)}
.subnav button.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
.frow{display:grid;grid-template-columns:220px 1fr;gap:16px;padding:16px 0;border-bottom:1px solid var(--border);align-items:center}
.frow:last-child{border-bottom:0}
.frow .flab b{font-size:13.5px}
.frow .flab p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.modeltable{width:100%;border-collapse:collapse;font-size:13px}
.modeltable th,.modeltable td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border)}
.modeltable th{font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--faint);font-weight:600}
.repo{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);margin-bottom:8px}
.repo .ract{display:flex;gap:4px;flex:none}
.auditrow{display:grid;grid-template-columns:150px 1fr 120px;gap:12px;font-size:12.5px;padding:10px 0;border-bottom:1px dashed var(--border)}
.auditrow:last-child{border-bottom:0}
.auditrow .who{font-weight:600}
.toggle{width:38px;height:22px;border-radius:999px;background:var(--surface-3);border:1px solid var(--border);position:relative;cursor:pointer;flex:none}
.toggle.on{background:var(--accent)}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.toggle.on::after{left:18px}

/* ===================== auth ===================== */
.authwrap{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px}
.authcard{width:min(400px,100%);background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);padding:30px}
.authbtn{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;font-size:13.5px;font-weight:600;border:1px solid var(--border-strong);border-radius:10px;padding:11px;margin-bottom:9px}
.authbtn:hover{border-color:var(--accent)}
.authdiv{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:12px;margin:16px 0}
.authdiv::before,.authdiv::after{content:"";flex:1;height:1px;background:var(--border)}

#s-login,#s-onboard{

      <button class="authbtn" data-soon="GitHub sign-in is coming soon — use your email for now"><svg width="17" height="17" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" style="flex:none"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.48-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 012-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg> Continue with GitHub</button>
      <div class="authdiv">or</div>
      <div id="wsField" style="display:none"><label class="tag">Workspace name</label><input id="ws" class="inp" style="margin:6px 0 12px" placeholder="Acme Inc" autocomplete="organization"></div>
      <label class="tag">Work email</label>
      <input id="email" class="inp" style="margin:6px 0 12px" type="email" placeholder="you@company.com" autocomplete="email">
      <label class="tag">Password</label>
      <input id="pw" class="inp" style="margin:6px 0 0" type="password" placeholder="At least 8 characters" autocomplete="current-password">
      <button class="btn pri block" id="authGo" style="margin-top:16px">Sign in</button>
      <div id="authErr" style="color:var(--crit);font-size:12px;margin-top:11px;text-align:center;min-height:14px;font-family:var(--font-m)"></div>
      <p style="text-align:center;font-size:12px;color:var(--faint);margin:18px 0 0" id="authAlt"></p>
    </div>
  </div>
</section>
<script>
var $=function(id){return document.getElementById(id)};
var TOKEN_KEY='aidlc_token';
var mode=new URLSearchParams(location.search).get('mode')==='signup'?'signup':'signin';
if(localStorage.getItem(TOKEN_KEY)) location.replace('/app');
function render(){
  var su=mode==='signup';
  $('authTitle').textContent=su?'Create your workspace':'Welcome back';
  $('authSub').textContent=su?'One workspace per team or product line.':'Sign in to your workspace';
  $('wsField').style.display=su?'block':'none';
  $('pw').setAttribute('autocomplete',su?'new-password':'current-password');
  $('pw').setAttribute('placeholder',su?'At least 8 characters':'Your password');
  $('authGo').textContent=su?'Create workspace':'Sign in';
  $('authAlt').innerHTML=su?'Already have a workspace? <a style="color:var(--accent-ink);font-weight:600;cursor:pointer" id="tog">Sign in</a>':'New here? <a style="color:var(--accent-ink);font-weight:600;cursor:pointer" id="tog">Create a workspace</a>';
  $('tog').onclick=function(){mode=su?'signin':'signup';$('authErr').textContent='';render();};
}
render();
document.querySelectorAll('[data-soon]').forEach(function(b){b.onclick=function(){$('authErr').textContent=b.getAttribute('data-soon');};});
async function submit(){
  $('authErr').textContent='';$('authGo').style.opacity='.6';
  try{
    var su=mode==='signup';
    var body={email:$('email').value.trim(),password:$('pw').value};
    if(su) body.workspaceName=$('ws').value.trim();
    var r=await fetch('/v1/auth/'+(su?'signup':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    var j=await r.json().catch(function(){return{}});
    if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
    localStorage.setItem(TOKEN_KEY,j.token);
    location.replace('/app');
  }catch(e){$('authErr').textContent='✗ '+e.message;$('authGo').style.opacity='1';}
}
$('authGo').onclick=submit;
['email','pw','ws'].forEach(function(id){var el=$(id);if(el)el.addEventListener('keydown',function(e){if(e.key==='Enter')submit();});});
</script>

</body></html>
